<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lit Windows</title>
<meta name="theme-color" content="#0c1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lit Windows">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
<style>
/* Night dollhouse: a navy night where rooms glow lamp-amber when someone is home. Single dark theme by design. */
:root{
  --night:#0c1120; --night-2:#121a2e; --wall:#19223d; --wall-2:#222c4b;
  --panel:rgba(17,24,42,.78); --panel-2:rgba(28,37,62,.82); --line:rgba(170,190,240,.14);
  --ink:#eaedf6; --muted:#a1aac4; --dim:#6f7894;
  --lamp:#f3b660; --lamp-hi:#ffd99c; --lamp-soft:rgba(243,182,96,.15);
  --rose:#ef8aa0; --sage:#7cc6a4; --bad:#ef7676;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree",-apple-system,"Segoe UI",system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:max(16px,env(safe-area-inset-left,0px)); --sr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{background:radial-gradient(120% 60% at 50% 110%,rgba(243,182,96,.10),transparent 60%),var(--night)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--night-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:none}
label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
[hidden]{display:none!important}
.ic{width:20px;height:20px;flex:none}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
em{font-style:italic;color:var(--muted)}

.page{max-width:720px;margin:0 auto;padding:calc(var(--st) + 14px) var(--sr) calc(var(--sb) + 28px) var(--sl);display:grid;gap:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--lamp);color:#241606;font-weight:600;border-radius:999px;padding:13px 20px}
.btn.ghost{background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 14px;font-size:14px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(239,118,118,.35)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.icon-btn.sm{width:34px;height:34px}
.icon-btn.sm .ic{width:18px;height:18px}
.sec{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--body)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}

/* house figure (fallback cover + brand mark) */
.housefig{position:absolute;inset:auto 0 0 0;margin:0 auto;width:58%;max-width:260px;aspect-ratio:1/1.05;display:grid;grid-template-rows:38% 1fr;pointer-events:none}
.housefig .rf{background:var(--wall-2);clip-path:polygon(50% 0,100% 100%,0 100%)}
.housefig .bd{background:var(--wall);display:grid;grid-template-columns:repeat(3,1fr);gap:9%;padding:10% 12%}
.housefig .w{background:#0d1426;border-radius:3px}
.housefig .w.on{background:radial-gradient(circle at 50% 40%,var(--lamp-hi),var(--lamp) 55%,#b77a2c);box-shadow:0 0 18px rgba(243,182,96,.55)}
.has-img>.housefig{display:none}

/* home */
.home-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{font-size:34px;line-height:1.05}
.brand span{color:var(--lamp)}
.sub{color:var(--muted);max-width:42ch;margin-top:6px}
.notice{display:grid;gap:8px;padding:14px 16px;border-radius:var(--r,14px);background:var(--lamp-soft);border:1px solid rgba(243,182,96,.35)}
.notice span{color:var(--muted);font-size:14px}
.notice .btn{justify-self:start}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:grid;text-align:left;border-radius:16px;overflow:hidden;background:var(--panel-2);border:1px solid var(--line);min-width:0}
.cover{position:relative;aspect-ratio:4/3;background:linear-gradient(180deg,#16203c,#0f1628 70%,#1b2a22);background-size:cover;background-position:center}
.card .meta{display:grid;gap:6px;padding:14px}
.card h3{font-size:20px}
.card p{color:var(--muted);font-size:14px}
.prog{font-size:13px;color:var(--lamp)}
.card.create{place-content:center;justify-items:center;text-align:center;gap:8px;padding:28px 18px;border-style:dashed;background:transparent;min-height:200px}
.card.create .ic{width:28px;height:28px;color:var(--lamp)}
.card.create span{color:var(--muted);font-size:14px;max-width:30ch}

/* story page */
.hero{position:relative;height:min(62vh,520px);background:linear-gradient(180deg,#1a2442,#0f1628 75%);background-size:cover;background-position:center 30%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,17,32,.35) 0,transparent 30%,rgba(12,17,32,.2) 55%,var(--night))}
.hero .icon-btn{position:absolute;z-index:2;top:calc(var(--st) + 12px);left:var(--sl)}
.story-v .page{margin-top:-90px;position:relative;z-index:1;padding-bottom:calc(var(--sb) + 110px)}
.title{font-size:32px;line-height:1.08}
.tagline{color:var(--lamp-hi);margin-top:4px}
.syn{color:var(--ink);max-width:62ch}
.goal{display:flex;gap:12px;padding:14px 16px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line)}
.goal .ic{color:var(--lamp);margin-top:2px}
.goal p{color:var(--muted);font-size:14px;margin-top:2px}
.you-card{display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line)}
.you-card .row{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.badge{justify-self:start;font-size:11px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:6px;background:var(--lamp-soft);color:var(--lamp)}
.cast{display:grid;gap:12px}
.cast-card{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);align-items:start}
.cast-card h3{font-size:18px}
.age{font-family:var(--body);font-weight:500;font-size:14px;color:var(--muted)}
.role{font-size:13px;color:var(--lamp)}
.intro{font-size:14px;color:var(--muted);margin-top:4px}
.por{width:96px;aspect-ratio:3/4;border-radius:10px;background:var(--wall) center/cover;display:grid;place-items:center;font:700 30px var(--display);color:var(--c,var(--lamp))}
.por.has-img{color:transparent}
.endings{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.endings li{padding:12px 14px;border-radius:12px;border:1px solid var(--line);font-size:14px;color:var(--muted)}
.endings li b{display:block;color:var(--ink);font-family:var(--display);font-size:16px}
.endings li.locked{border-style:dashed;color:var(--dim)}
.cta-bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:10px;justify-content:center;padding:14px var(--sr) calc(var(--sb) + 14px) var(--sl);background:linear-gradient(180deg,transparent,var(--night) 35%)}
.cta-bar .btn{flex:1;max-width:340px}

/* play */
.play{position:fixed;inset:0;display:flex;flex-direction:column}
.bg{position:absolute;inset:0;z-index:-1;background:radial-gradient(80% 45% at 70% 20%,rgba(243,182,96,.08),transparent),linear-gradient(180deg,#141d36,var(--night));background-size:cover;background-position:center}
.bg.has-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,17,32,.62),rgba(12,17,32,.78) 45%,rgba(12,17,32,.94))}
.top{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:10px;padding:calc(var(--st) + 8px) var(--sr) 6px var(--sl)}
.clock{text-align:center;line-height:1.2}
.clock b{font-family:var(--display);font-size:17px}
.clock b i{font-style:normal;color:var(--lamp)}
.clock span{display:block;font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px var(--sr) 6px var(--sl);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap}
.chip .ic{width:14px;height:14px}
.chip.ev{border-color:rgba(243,182,96,.45);color:var(--lamp-hi)}
.chip.ev.live{background:rgba(243,182,96,.18)}
.chip.done{color:var(--sage);border-color:rgba(124,198,164,.4)}
.chip b{font-weight:600}
.rail{position:absolute;right:var(--sr);top:calc(var(--st) + 104px);z-index:3;display:grid;gap:8px}
.rail .icon-btn{width:42px;height:42px}
.log{flex:1;overflow-y:auto;padding:8px calc(var(--sr) + 50px) 12px var(--sl);display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.log>:first-child{margin-top:auto}
.m-n{font-style:italic;color:#c9cfe0;max-width:60ch;font-size:15px;line-height:1.55}
.m-n em{color:#c9cfe0}
.m-c{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;max-width:62ch}
.m-name{font-size:13px;font-weight:600;color:var(--c,var(--lamp));display:block;margin-bottom:3px}
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 13px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.bubble em{color:#b7bfd6}
.m-p{align-self:flex-end;max-width:min(82%,52ch)}
.m-p .bubble{background:rgba(243,182,96,.16);border-color:rgba(243,182,96,.35);border-radius:16px 4px 16px 16px}
.m-p .bubble em{color:var(--lamp-hi)}
.m-s{align-self:center;font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:4px 12px;border-radius:999px;text-align:center;max-width:90%}
.m-s.ev{color:var(--lamp-hi);border-color:rgba(243,182,96,.4)}
.m-d{display:flex;flex-wrap:wrap;gap:6px;padding-left:44px}
.m-d span{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.up{color:var(--rose)} .down{color:#8fa3d6} .m-d .hm.up{color:var(--sage)} .m-d .hm.down{color:var(--bad)}
.m-i{margin:0;align-self:flex-start;width:min(78%,360px);border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel);aspect-ratio:3/4;display:grid;place-items:center;color:var(--muted);font-size:13px}
.m-i img{width:100%;height:100%;object-fit:cover;display:block}
.m-i img:not([src]){display:none}
.tools{display:flex;gap:8px;padding-left:44px}
.av{width:34px;height:34px;border-radius:50%;background:var(--wall) center 20%/cover;display:grid;place-items:center;font:700 14px var(--display);color:var(--c,var(--lamp));border:1.5px solid var(--c,var(--line));flex:none}
.av.has-img{color:transparent}
.av.lg{width:54px;height:54px;font-size:20px}
.typing{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--lamp);animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.sugs{display:grid;gap:6px;margin-top:2px}
.sug{display:grid;grid-template-columns:38px 1fr;gap:6px}
.sug button{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sug .pen{display:grid;place-items:center;color:var(--muted)}
.sug .pen .ic{width:16px;height:16px}
.sug .go{text-align:left;padding:9px 12px;font-size:14px;line-height:1.4}
.sug .go em{color:var(--lamp-hi)}
.composer{margin:0 var(--sr) calc(var(--sb) + 10px) var(--sl);background:var(--panel-2);border:1px solid var(--line);border-radius:18px;padding:8px 8px 8px 12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.composer textarea{background:transparent;border:0;padding:6px 2px;max-height:140px;line-height:1.4}
.composer textarea:focus-visible{outline:none}
.c-row{display:flex;align-items:center;gap:6px}
.c-row .hint{flex:1;font-size:12px;color:var(--dim);padding-left:4px}
.send{width:40px;height:40px;border-radius:50%;background:var(--lamp);color:#241606;display:grid;place-items:center}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-bg{position:absolute;inset:0;background:rgba(5,8,16,.6)}
.sheet{position:relative;max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;background:#10172a;border-top:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:760px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px)}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:16px var(--sr) 8px var(--sl)}
.sheet-h b{font-family:var(--display);font-size:20px}
.sheet-body{overflow-y:auto;padding:6px var(--sr) calc(var(--sb) + 22px) var(--sl);display:grid;gap:14px;align-content:start}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink)}
.check input{width:20px;height:20px}
.muted{color:var(--muted);font-size:13px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.group{display:grid;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px}
.group>h3{font-size:16px}

/* map */
.map{display:grid;gap:0;padding:4px 0}
.roof{background:var(--wall-2);clip-path:polygon(50% 0,100% 100%,0 100%);height:118px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px}
.roof .room{width:44%;min-height:62px}
.floor{background:var(--wall);padding:8px;display:grid;gap:6px;border-top:4px solid #0e1528}
.floor .fl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.rooms{display:grid;gap:6px}
.floor.outside{background:linear-gradient(180deg,#14261f,#0f1b17);border-top:4px solid #0b1411;border-radius:0 0 14px 14px}
.room{position:relative;min-height:84px;border-radius:8px;background:#0d1426;border:1px solid rgba(170,190,240,.08);padding:7px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:4px;overflow:hidden;min-width:0}
.room .rn{font-size:12px;font-weight:600;color:var(--dim);line-height:1.2}
.room.lit{background:radial-gradient(120% 90% at 50% 0,rgba(255,217,156,.42),rgba(243,182,96,.12) 60%,rgba(243,182,96,.04)),#2a2214;border-color:rgba(243,182,96,.35)}
.room.lit .rn{color:var(--lamp-hi)}
.room.here{outline:2px solid var(--lamp);outline-offset:-2px}
.room .occ{display:flex;flex-wrap:wrap;gap:3px}
.room .occ .av{width:24px;height:24px;font-size:11px}
.room .you{font-size:10px;font-weight:700;letter-spacing:.08em;color:#241606;background:var(--lamp);padding:1px 6px;border-radius:5px;align-self:flex-start}
.room .evm{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--lamp);box-shadow:0 0 0 0 rgba(243,182,96,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(243,182,96,0)}100%{box-shadow:0 0 0 0 rgba(243,182,96,0)}}
.room .hintx{font-size:10.5px;color:var(--lamp-hi);font-style:italic;line-height:1.25}
.outstrip{margin-top:10px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.roompanel{display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line)}
.roompanel h3{font-size:18px}

/* characters */
.car{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.car button{border-radius:50%;padding:3px;border:2px solid transparent}
.car button.on{border-color:var(--lamp)}
.ccard{display:grid;gap:12px;padding:14px;border-radius:16px;background:var(--panel-2);border:1px solid var(--line)}
.ccard-top{display:grid;grid-template-columns:1fr 92px;gap:12px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.aff{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.aff b{font-family:var(--display);font-size:20px;color:var(--rose)}
.aff small{font-size:12px;color:var(--dim);font-family:var(--body);font-weight:400}
.bar{height:6px;border-radius:9px;background:rgba(170,190,240,.12);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#c86a83,var(--rose));border-radius:9px}
.bar.hm i{background:linear-gradient(90deg,#4f9a7a,var(--sage))}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--panel-2)}
.tabs button{padding:8px 4px;border-radius:9px;font-size:13.5px;color:var(--muted)}
.tabs button.on{background:var(--ink);color:var(--night);font-weight:600}
.th{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.th-h{display:flex;gap:10px;align-items:baseline;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.th-h b{font-size:15px}
.th-h .r{margin-left:auto}
.grid-img{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.grid-img button{aspect-ratio:3/4;border-radius:10px;background:var(--wall) center/cover;border:1px solid var(--line);position:relative}
.grid-img button span{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(12,17,32,.7);padding:1px 6px;border-radius:5px}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
.diary{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:4px}
.diary b{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.diary p{font-style:italic;color:#d6dbea}

/* overlays */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 90px);z-index:40;max-width:min(92vw,440px);background:#2a1d22;border:1px solid rgba(239,118,118,.4);color:var(--ink);padding:10px 14px;border-radius:12px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.ok{background:#16261f;border-color:rgba(124,198,164,.4)}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(5,8,16,.94);display:grid;place-items:center;padding:calc(var(--st) + 10px) var(--sr) calc(var(--sb) + 10px) var(--sl)}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}
.busy-cover{position:fixed;inset:0;z-index:45;background:rgba(8,12,22,.86);display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:0 var(--sr) 0 var(--sl)}
.busy-cover p{color:var(--muted);max-width:34ch}

 const m={401:'Your API key was rejected. Check it in Settings.',402:'Your AI account is out of credits.',429:'Too many requests. Wait a few seconds and try again.'}[r.status];
 return m||`AI error ${r.status}: ${String(b).slice(0,160)}`}

function fixCtl(s){let o='',q=false,e=false;for(const ch of s){if(q){if(e){e=false;o+=ch;continue}if(ch==='\\'){e=true;o+=ch;continue}if(ch==='"'){q=false;o+=ch;continue}if(ch==='\n'){o+='\\n';continue}if(ch==='\r')continue;if(ch==='\t'){o+='\\t';continue}o+=ch}else{if(ch==='"')q=true;o+=ch}}return o}
function parseJSON(raw){let t=String(raw||'');const f=t.match(/```(?:json)?\s*([\s\S]*?)```/i);if(f)t=f[1];const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<=a)return null;let s=t.slice(a,b+1);
 for(const fx of [x=>x,fixCtl,x=>fixCtl(x).replace(/,\s*([}\]])/g,'$1')]){try{return JSON.parse(fx(s))}catch{}}return null}

 if(out.length)return out;const plain=String(raw).replace(/```[\s\S]*?```/g,'').replace(/[{}[\]]/g,'').trim();return plain?[{who:'narrator',text:plain.slice(0,1500)}]:[]}

function b64Blob(b,type){const bin=atob(b.replace(/^data:[^,]+,/,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type})}
async function genImage(prompt,w,h){
 const key=S.imgKey||S.apiKey;if(!key)throw new Error('Add your API key in Settings first.');
 if(S.imgType==='venice'){
  const r=await fetchT('https://api.venice.ai/api/v1/image/generate',{method:'POST',headers:hdr(key),body:JSON.stringify({model:S.imgModel,prompt:prompt.slice(0,1450),negative_prompt:NEG,width:w,height:h,format:'webp',safe_mode:false,hide_watermark:true,return_binary:false})},180000);
  if(!r.ok)throw new Error(await errText(r));const d=await r.json();const b=d.images?.[0];if(!b)throw new Error('The image service returned nothing.');return b64Blob(b,'image/webp')}

 if(!r.ok)throw new Error(await errText(r));const d=await r.json();const it=d.data?.[0];
 if(it?.b64_json)return b64Blob(it.b64_json,'image/png');if(it?.url){const x=await fetch(it.url);return await x.blob()}throw new Error('The image service returned nothing.')}

/* ---------- images: cache + queue ---------- */
function setURL(k,blob){if(URLS.has(k))URL.revokeObjectURL(URLS.get(k));URLS.set(k,URL.createObjectURL(blob))}
async function preload(sid){const keys=await DB.keys('img');for(const k of keys){if(String(k).split(':')[1]!==sid||URLS.has(k))continue;const b=await DB.get(k,'img');if(b)setURL(k,b)}}

async function runJobs(){if(running)return;running=true;while(jobs.length){const j=jobs.shift();try{const b=await genImage(j.prompt,j.w,j.h);await DB.set(j.k,b,'img');setURL(j.k,b);imgErr=0}catch(e){if(++imgErr<=2)toast('Image failed: '+e.message);$$(`[data-img="${CSS.escape(j.k)}"]`).forEach(el=>{const f=el.closest('.m-i');if(f)f.firstChild&&f.firstChild.nodeType===3&&(f.firstChild.textContent='Image failed. Tap the picture button to try again.')})}pendingImgs.delete(j.k);paint(j.k)}running=false}

/* ---------- stories ---------- */
async function allStories(){return [ALDER,...arr(await DB.get('stories'))]}
async function getStory(id){return (await allStories()).find(s=>s.id===id)}
function houseFig(seed){let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;let w='';for(let i=0;i<9;i++)w+=`<span class="w${(h>>i)&1||i===4?' on':''}"></span>`;return `<div class="housefig" aria-hidden="true"><div class="rf"></div><div class="bd">${w}</div></div>`}

/* ---------- prompts ---------- */
function sysPrompt(){const s=STORY;
 return `You are the narrator and game master of "${s.title}", an interactive story game. You voice every character except the player, and you write the narration.

PREMISE: ${s.synopsis}
SETTING: ${s.setting}
PLAYER: ${G.player.name} (${G.player.pronouns}). ${G.player.bio}
CHARACTERS (every character is an adult aged 18 or older; never describe anyone as underage or childlike):
${s.characters.map(c=>`- ${c.name} [id: ${c.id}], ${c.age}, ${c.role}. ${c.personality}`).join('\n')}
ROOMS (ids): ${s.rooms.map(r=>`${r.id} (${r.name})`).join(', ')}; use "out" for anyone away from the house.

HOW TO WRITE
- Second person for the player ("you"), present tense. Vivid but brisk: 2-6 beats per reply.
- A beat is narration ({"who":"narrator"}, 1-3 sentences) or one character's turn ({"who":"<their id>"}): actions in *asterisks*, then what they say.
- Only characters in the player's room can talk or act on screen. Characters may come and go; report it in "moves".
- Never speak, act or decide feelings for the player. End on a moment that invites a response.
- Continuity matters: treat SUMMARY and MEMORY as true. Keep track of where everyone is, what they wear and what already happened.
- Characters have their own wants, moods and schedules. They can disagree, tease, refuse or surprise.
- Relationships are open: the player may pursue one person, several, or nobody. Others notice. Juggling people carelessly or dishonestly causes jealousy and lowers House Harmony; honesty and care can lead characters to accept a shared relationship over time.
- Affection is earned: usually -3 to +3 per turn, only for characters who saw or were affected by what happened. Each change needs a one-sentence inner thought in that character's voice.
${s.rules?'- '+s.rules+'\n':''}${S.authorNote?'AUTHOR NOTE: '+S.authorNote+'\n':''}
REPLY FORMAT: only one JSON object, no other text:
{"beats":[{"who":"narrator","text":"..."},{"who":"<character id>","text":"*action* words"}],
"affection":[{"who":"<id>","delta":2,"thought":"inner thought"}],
"mood":{"<id>":"one or two words"},
"outfit":{"<id>":"what they are wearing now, only if it changed"},
"harmony":0,
"minutes":10,
"moves":{"<id>":"<room id or out>"},
"player_room":null,
"elsewhere":{"room":"<room id>","text":"short hint of what is happening there right now"},
"event_done":false,
"memory":["new lasting fact worth remembering"],
"suggestions":[{"action":"short action","line":"what the player says"},{"action":"...","line":"..."},{"action":"...","line":"..."}]}
Use empty arrays, empty objects or null when nothing applies. "harmony" is the change to House Harmony (-10 to +10). "minutes" is how much time this exchange took (5-60). Give 3 distinct suggestions for the player's next move: one bold, one kind, one curious or playful.`}
function transcript(n=26){const nm=G.player.name;return G.msgs.filter(m=>m.k==='n'||m.k==='c'||m.k==='p'||m.k==='s').slice(-n).map(m=>m.k==='n'?'Narrator: '+m.t:m.k==='c'?(chr(m.who)?.name||m.who)+': '+m.t:m.k==='p'?nm+': '+m.t:'('+m.t+')').join('\n')}
function eventInfo(){const e=todaysEvent();if(!e)return 'No event today.';const st=evState(e);
 if(st==='active')return `TODAY'S EVENT (active until ${clock(evEnd(e))}): "${e.title}" in ${roomName(e.room)}. ${e.desc} Objective: ${e.objective} ${G.room===e.room?'The player is there: play the event out.':'The player is not there yet; characters can hint at it or come find them.'} Set "event_done": true once the objective is resolved.`;
 if(st==='upcoming')return `TODAY'S EVENT (later, from ${e.start}): "${e.title}" in ${roomName(e.room)}. Characters may set it up or mention it, but do not start it yet.`;
 return `Today's event "${e.title}" is ${st==='done'?'finished':'over (the player missed it)'}.`}
function turnPrompt(action){const here=present(),away=STORY.characters.filter(c=>!here.includes(c)),r=room(G.room);
 return `STATE
${dayLabel()}, ${clock(G.min)} (${partOf(G.min)}). ${G.player.name} is in: ${roomName(G.room)}${r?' ('+r.desc+')':''}.
With ${G.player.name}: ${here.length?here.map(c=>`${c.name} [${c.id}] (mood ${G.chars[c.id].mood}, affection ${G.chars[c.id].aff}, wearing ${outfitOf(c)})`).join('; '):'nobody'}.
Elsewhere: ${away.map(c=>`${c.name} in ${roomName(charRoom(c))}`).join('; ')||'nobody'}.
House Harmony: ${G.harmony}/100.
${eventInfo()}
${G.summary?'\nSUMMARY SO FAR:\n'+G.summary+'\n':''}${G.memory.length?'\nMEMORY:\n- '+G.memory.join('\n- ')+'\n':''}
RECENT STORY:
${transcript()||'(the story is just beginning)'}

PLAYER'S MOVE (${G.player.name}): ${action}

Continue from here. Reply with the JSON object only.`}

/* ---------- turn engine ---------- */
function applyTurn(o,raw,opts){
 let beats=arr(o?.beats);if(!beats.length)beats=salvage(raw);if(!beats.length)throw new Error('The AI reply was empty. Try again.');
 for(const b of beats){const t=String(b?.text||'').trim();if(!t)continue;const c=findChar(b.who);c?pushMsg({k:'c',who:c.id,t}):pushMsg({k:'n',t})}
 o=obj(o);const deltas=[];
 for(const a of arr(o.affection)){const c=findChar(a?.who);if(!c)continue;const d=clamp(Math.round(+a.delta||0),-6,6);if(!d)continue;const ch=G.chars[c.id],from=ch.aff;ch.aff=clamp(from+d,0,100);ch.thoughts.unshift({turn:G.turn+1,day:G.day,part:partOf(G.min),d,from,to:ch.aff,t:String(a.thought||'')});ch.thoughts.length=Math.min(ch.thoughts.length,80);deltas.push({who:c.id,d})}
 for(const[k,v]of Object.entries(obj(o.mood))){const c=findChar(k);if(c&&v)G.chars[c.id].mood=String(v).slice(0,24)}
 for(const[k,v]of Object.entries(obj(o.outfit))){const c=findChar(k);if(c&&v)G.chars[c.id].outfit=String(v).slice(0,140)}
 const hd=clamp(Math.round(+o.harmony||0),-10,10);if(hd){G.harmony=clamp(G.harmony+hd,0,100);deltas.push({who:'harmony',d:hd})}
 if(deltas.length)pushMsg({k:'d',list:deltas});
 G.min+=opts.minutes||clamp(Math.round(+o.minutes||10),1,120);
 const rooms=new Set(STORY.rooms.map(r=>r.id));
 for(const[k,v]of Object.entries(obj(o.moves))){const c=findChar(k);const rm=String(v||'');if(c&&(rm==='out'||rooms.has(rm)))G.chars[c.id].ov={room:rm,pk:pkey()}}
 if(o.player_room&&rooms.has(o.player_room))G.room=o.player_room;
 const el=obj(o.elsewhere);if(el.text&&rooms.has(el.room)&&el.room!==G.room){G.elsewhere={room:el.room,text:String(el.text).slice(0,140),turn:G.turn+1};pushMsg({k:'s',t:`${roomName(el.room)}: ${G.elsewhere.text}`})}
 const e=todaysEvent();if(o.event_done&&e&&evState(e)==='active'){G.ev[e.day]='done';pushMsg({k:'s',ev:1,t:`Event complete: ${e.title}`});if(e.final)G.pendingEnd=true}
 for(const m of arr(o.memory)){const s=String(m||'').trim().slice(0,180);if(s&&!G.memory.includes(s))G.memory.push(s)}G.memory=G.memory.slice(-40);
 G.sugs=arr(o.suggestions).slice(0,3).map(s=>({a:String(s?.action||'').replace(/\*/g,''),l:String(s?.line||'').replace(/^"|"$/g,'')})).filter(s=>s.a||s.l)}

async function playerTurn(text,opts={}){
 if(busy)return;if(!S.apiKey){openSettings();toast('Add your API key to play.');return}
 const g=G,snap=clone(G);busy=true;lastTurn={snap:clone(snap),text,opts};let ok=false;
 if(opts.move){G.room=opts.move;pushMsg({k:'s',t:`You head to the ${roomName(opts.move)}.`})}
 if(opts.note)pushMsg({k:'s',t:opts.note});
 if(!opts.hidden)pushMsg({k:'p',t:text});
 G.sugs=[];renderPlay();
 try{
  const raw=await chat([{role:'system',content:sysPrompt()},{role:'user',content:turnPrompt(text)}]);
  if(G===g){applyTurn(parseJSON(raw),raw,opts);G.turn++;await afterTurn();ok=true}
 }catch(e){if(G===g){G=snap;if(!opts.hidden&&VIEW==='play'){const i=$('#inp');if(i&&!i.value)i.value=text}}toast(e.message)}
 busy=false;
 if(G===g||G===snap){await save();if(VIEW==='play')renderPlay()}
 if(ok&&G===g&&G.pendingEnd&&!G.ended)await finishStory();
}
async function afterTurn(){
 const e=todaysEvent();if(e&&!G.ev[e.day]&&G.min>evEnd(e)){G.ev[e.day]='missed';G.harmony=clamp(G.harmony-3,0,100);pushMsg({k:'s',t:`You missed today's event: ${e.title}`});if(e.final)G.pendingEnd=true}
 if(G.harmony<=10&&!G.ended){G.pendingEnd=true;return}
 queueRoom();
 if(G.msgs.length-G.sumUpto>56)summarize();
 if(G.min>=1440+150&&!G.pendingEnd){pushMsg({k:'s',t:'Exhaustion wins. You drift off to sleep.'});await save();setTimeout(()=>endDay(),400)}
}
async function summarize(){const g=G,upto=G.msgs.length-26;const part=G.msgs.slice(G.sumUpto,upto).filter(m=>m.k!=='i'&&m.k!=='d').map(m=>m.k==='n'?m.t:m.k==='c'?(chr(m.who)?.name)+': '+m.t:m.k==='p'?G.player.name+': '+m.t:'('+m.t+')').join('\n');
 try{const t=await chat([{role:'user',content:`Update the running summary of an interactive story so the narrator never forgets what happened. Keep names, relationships, promises, secrets, conflicts, who is with whom, and where things stand. Under 220 words, plain prose.\n\nPREVIOUS SUMMARY:\n${G.summary||'(none)'}\n\nNEW EVENTS:\n${part}`}],{max:600,temp:.4});if(G===g&&t){G.summary=t.slice(0,2000);G.sumUpto=upto;save()}}catch(e){console.warn('summary failed',e)}}
async function endDay(){
 if(busy||!G)return;busy=true;const g=G;cover('The house goes quiet…','Everyone writes in their diary.');
 try{const raw=await chat([{role:'user',content:`It is the end of ${dayLabel()} in the interactive story "${STORY.title}". Write each character's private diary entry for today: 2-4 sentences, first person, in their own voice, about their day and their feelings about ${G.player.name} (${G.player.pronouns}). All characters are adults.\nCharacters: ${STORY.characters.map(c=>`${c.name} [${c.id}] affection ${G.chars[c.id].aff}/100, mood ${G.chars[c.id].mood}`).join('; ')}\n${G.summary?'Summary: '+G.summary+'\n':''}Today:\n${transcript(40)}\n\nReply with only JSON: {"<id>":"entry"}`}],{max:900,temp:.8});
  const d=obj(parseJSON(raw));for(const[k,v]of Object.entries(d)){const c=findChar(k);if(c&&v&&G===g)G.chars[c.id].diary.unshift({day:G.day,t:String(v).slice(0,900)})}}catch(e){console.warn('diary failed',e)}
 if(G!==g){busy=false;uncover();return}
 const e=todaysEvent();if(e&&!G.ev[e.day]){G.ev[e.day]='missed';pushMsg({k:'s',t:`You missed today's event: ${e.title}`});if(e.final)G.pendingEnd=true}
 const lastDay=Math.max(...STORY.events.map(x=>x.day),7);
 for(const c of STORY.characters)G.chars[c.id].ov=null;
 busy=false;uncover();
 if(G.day>=lastDay||G.pendingEnd){await save();return finishStory()}
 G.day++;G.min=8*60;G.room=STORY.player_room;G.elsewhere=null;
 pushMsg({k:'s',t:`${dayLabel()} · ${clock(G.min)}`});await save();
 if(VIEW!=='play')viewPlay();else renderPlay();
 playerTurn('*wakes up in their room as a new day starts*',{hidden:true,minutes:5});
}
function computeEnding(){const a=STORY.characters.map(c=>({c,a:G.chars[c.id].aff})).sort((x,y)=>y.a-x.a);const hi=a.filter(x=>x.a>=75).length,avg=a.reduce((s,x)=>s+x.a,0)/a.length;
 if(G.harmony<=10)return{key:'out'};if(hi>=Math.min(3,a.length)&&G.harmony>=65)return{key:'group'};if(a[0].a>=75)return{key:'one',with:a[0].c.id};if(G.harmony>=55&&avg>=50)return{key:'found'};return{key:'out'}}
async function finishStory(){
 const g=G;const end=computeEnding();const def=STORY.endings?.[end.key]||{title:end.key,desc:''};
 let title=def.title;if(end.key==='one')title+=` · ${chr(end.with).name}`;
 cover('Writing your ending…','The week on '+STORY.title+' comes to a close.');
 let epi=def.desc;
 try{epi=await chat([{role:'user',content:`Write the epilogue for the interactive story "${STORY.title}". Ending reached: "${title}": ${def.desc}${end.with?` The player ends up with ${chr(end.with).name}.`:''}\nPlayer: ${G.player.name} (${G.player.pronouns}). All characters are adults.\nFinal affection: ${STORY.characters.map(c=>`${c.name} ${G.chars[c.id].aff}/100`).join(', ')}. House Harmony ${G.harmony}/100.\n${G.summary?'Story summary: '+G.summary+'\n':''}Last scenes:\n${transcript(30)}\n\nWrite 3 short paragraphs in second person, specific to what actually happened, ending on a single resonant image. Plain prose only.`}],{max:900,temp:.85})||epi}catch(e){console.warn(e)}
 uncover();if(G!==g)return;
 G.ended={key:end.key,title,epi,with:end.with||null};G.pendingEnd=false;await save();
 const f=arr(await DB.get('endings:'+STORY.id));if(!f.includes(end.key)){f.push(end.key);await DB.set('endings:'+STORY.id,f)}
 showEnding()}

const save=()=>G&&DB.set('save:'+G.storyId,G);
function newGame(s,player){const o=s.opening||{};
 const g={v:1,storyId:s.id,player,day:1,min:toMin(o.time||'16:00'),room:o.room||s.player_room,turn:0,harmony:70,msgs:[],chars:{},ev:{},memory:[],summary:'',sumUpto:0,sugs:[],ended:null,elsewhere:null};
 for(const c of s.characters)g.chars[c.id]={aff:c.affection??20,mood:'Curious',ov:null,outfit:'',thoughts:[],diary:[]};
 G=g;pushMsg({k:'s',t:`${dayLabel()} · ${clock(g.min)}`});
 for(const b of arr(o.beats)){const t=String(b.text||'').replaceAll('{name}',player.name);const c=findChar(b.who);if(c){pushMsg({k:'c',who:c.id,t});g.chars[c.id].ov={room:g.room,pk:pkey()}}else pushMsg({k:'n',t})}
 g.sugs=arr(o.suggestions).slice(0,3).map(x=>({a:x.action||'',l:x.line||''}));return g}

function renderPlay(){if(VIEW!=='play'||!G)return;

 const events=arr(d.events).slice(0,7).map((e,i)=>({day:i+1,title:String(e.title||'Day '+(i+1)).slice(0,60),room:mapR(e.room)||pr,start:/^\d{1,2}:\d{2}$/.test(e.start)?e.start:'19:00',end:/^\d{1,2}:\d{2}$/.test(e.end)?e.end:'22:00',cast:arr(e.cast).map(sid).filter(x=>cids.has(x)),desc:String(e.desc||'').slice(0,500),objective:String(e.objective||'').slice(0,200),final:i===6||undefined}));
 const op=obj(d.opening);const end=obj(d.endings);const E=k=>({title:String(obj(end[k]).title||{group:'Together',one:'One Heart',found:'Found Family',out:'Moving Out'}[k]).slice(0,60),desc:String(obj(end[k]).desc||'').slice(0,300)});
 return{id:'c_'+uid(),title:String(d.title||'Untitled story').slice(0,70),tagline:String(d.tagline||'').slice(0,140),tags:arr(d.tags).slice(0,4).map(t=>String(t).slice(0,20)),synopsis:String(d.synopsis||brief.prem).slice(0,700),goal:String(d.goal||'').slice(0,240),setting:String(d.setting||brief.set||'').slice(0,300),cover:String(d.cover||d.setting||'').slice(0,400),rules:String(d.rules||'').slice(0,300),player:brief.player,player_room:pr,rooms,characters:chars,events,
  opening:{room:mapR(op.room)||pr,time:/^\d{1,2}:\d{2}$/.test(op.time)?op.time:'16:00',beats:arr(op.beats).slice(0,6).map(b=>({who:cids.has(sid(b.who))?sid(b.who):'narrator',text:String(b.text||'')})),suggestions:arr(op.suggestions).slice(0,3)},
  endings:{group:E('group'),one:E('one'),found:E('found'),out:E('out')}}}

/* ---------- ending ---------- */
function showEnding(){const en=G.ended;if(!en)return;VIEW='ending';closeSheet();
 app.innerHTML=`<div class="ending"><div class="page"><span class="kicker">${esc(STORY.title)} · Ending</span><h1>${esc(en.title)}</h1>
 <div class="epi">${String(en.epi||'').split(/\n\s*\n/).map(p=>`<p>${fmt(p.trim())}</p>`).join('')}</div>
 <h2 class="sec">Where everyone stands</h2><div class="stats">${STORY.characters.map(c=>`<div class="stat"><span>${esc(c.name)}</span><div class="bar"><i style="width:${G.chars[c.id].aff}%"></i></div><b>${G.chars[c.id].aff}</b></div>`).join('')}<div class="stat"><span>House Harmony</span><div class="bar hm"><i style="width:${G.harmony}%"></i></div><b>${G.harmony}</b></div></div>
 <div class="btn-row"><button class="btn" data-act="tostory">Back to the story page</button><button class="btn ghost" data-act="home">Library</button></div></div></div>`}

/* ---------- overlays ---------- */
function cover(t,sub){uncover();const d=document.createElement('div');d.className='busy-cover';d.id='busycover';d.innerHTML=`<span class="dots"><i></i><i></i><i></i></span><h2>${esc(t)}</h2><p>${esc(sub||'')}</p>`;document.body.append(d)}
function uncover(){$('#busycover')?.remove()}
function zoom(k){const u=URLS.get(k);if(!u)return;const d=document.createElement('div');d.className='lightbox';d.innerHTML=`<img src="${u}" alt="Full-size picture">`;d.addEventListener('click',()=>d.remove());document.body.append(d)}

/* ---------- backup ---------- */
async function exportBackup(){const keys=await DB.keys();const data={};for(const k of keys){if(k==='settings')continue;data[k]=await DB.get(k)}
 const blob=new Blob([JSON.stringify({app:'litwindows',v:1,data})],{type:'application/json'});const name=`lit-windows-backup-${new Date().toISOString().slice(0,10)}.json`;const file=new File([blob],name,{type:'application/json'});
 try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Lit Windows backup'});return}}catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
async function importBackup(e){const f=e.target.files?.[0];if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!=='litwindows')throw new Error();for(const[k,v]of Object.entries(obj(j.data)))if(k!=='settings')await DB.set(k,v);toast('Backup imported.',true);closeSheet();viewHome()}catch{toast('That file is not a Lit Windows backup.')}}

/* ---------- actions ---------- */
let armed=null;
const ACT={
 home:()=>viewHome(), settings:()=>openSettings(), create:()=>viewCreate(), closesheet:()=>{const wasSettings=SHEET==='settings';closeSheet();if(VIEW==='play')renderPlay();else if(VIEW==='home'&&wasSettings)viewHome()},
 open:b=>viewStory(b.dataset.id), tostory:()=>viewStory(STORY.id),
 async new(b){const id=STORY.id;if(await DB.get('save:'+id)&&armed!=='new'){armed='new';b.textContent='Tap again to overwrite';setTimeout(()=>{if(armed==='new'){armed=null;if(b.isConnected)b.textContent='Start new'}},3500);return}armed=null;
  const pl={...STORY.player,...obj(await DB.get('player:'+id))};G=newGame(STORY,pl);lastTurn=null;await save();viewPlay()},
 async continue(){G=await DB.get('save:'+STORY.id);if(!G)return;for(const c of STORY.characters)if(!G.chars[c.id])G.chars[c.id]={aff:20,mood:'Curious',ov:null,outfit:'',thoughts:[],diary:[]};lastTurn=null;G.ended?showEnding():viewPlay()},
 leave:()=>viewStory(STORY.id),
 sug:b=>{const s=G.sugs[+b.dataset.i];if(s&&!busy)playerTurn(sugText(s))},
 editsug:b=>{const s=G.sugs[+b.dataset.i];const i=$('#inp');i.value=sugText(s);i.dispatchEvent(new Event('input'));i.focus()},
 togglesugs:()=>{showSugs=!showSugs;renderPlay()},
 star:()=>{const i=$('#inp'),p=i.selectionStart??i.value.length;i.value=i.value.slice(0,p)+'**'+i.value.slice(p);i.focus();i.setSelectionRange(p+1,p+1)},
 regen:()=>{if(busy||!lastTurn)return;const{snap,text,opts}=lastTurn;G=clone(snap);playerTurn(text,opts)},
 picture:()=>{if(S.imgType==='off')return toast('Images are turned off in Settings.');const here=present(),r=room(G.room);const last=G.msgs.filter(m=>m.k==='n'||m.k==='c').slice(-3).map(m=>(m.k==='c'?chr(m.who)?.name+': ':'')+m.t.replace(/\*/g,'')).join(' ');
  const k=imgKey('scn',STORY.id,uid());pushMsg({k:'i',key:k});
  queueImg(k,`${S.artStyle}. Scene in ${r?r.name+', '+r.desc:'the house'} at ${partOf(G.min)}. ${here.map(c=>`${c.name}, ${gword(c)} aged ${c.age}: ${c.look}, wearing ${outfitOf(c)}`).join('. ')}. Moment: ${last.slice(0,650)}`,768,1024,true);save();renderPlay()},
 zoom:b=>zoom(b.dataset.k),
 map:()=>{SHEET='map';selRoom=null;openSheet('The house',mapBody())},
 chars:()=>{SHEET='chars';openSheet('Characters',charsBody())},
 gallery:()=>{SHEET='gallery';openSheet('Gallery',galleryBody())},
 room:b=>{selRoom=b.dataset.id;refreshSheet();$('#sb').scrollTop=0},
 goroom:b=>{const id=b.dataset.id;closeSheet();playerTurn(`*heads to the ${roomName(id)}*`,{move:id,hidden:true})},
 wait:()=>{closeSheet();playerTurn('*lets an hour pass doing their own thing around the house*',{hidden:true,minutes:60,note:'An hour passes.'})},
 sleep:()=>{closeSheet();endDay()},
 selchar:b=>{selChar=b.dataset.id;refreshSheet()},
 ctab:b=>{cTab=b.dataset.t;refreshSheet()},
 setpor:async b=>{const blob=await DB.get(b.dataset.k,'img');if(!blob)return;const k=imgKey('por',STORY.id,selChar);await DB.set(k,blob,'img');setURL(k,blob);paint(k);refreshSheet();toast('Portrait updated.',true)},
 async loadmodels(){try{const r1=await fetch(base()+'/models?type=text',{headers:S.apiKey?{Authorization:'Bearer '+S.apiKey}:{}});const d1=await r1.json();$('#dl-text').innerHTML=arr(d1.data).map(m=>`<option value="${esc(m.id)}">`).join('');
  if(S.imgType==='venice'){const r2=await fetch('https://api.venice.ai/api/v1/models?type=image');const d2=await r2.json();$('#dl-img').innerHTML=arr(d2.data).map(m=>`<option value="${esc(m.id)}">`).join('')}toast(`Loaded ${arr(d1.data).length} models. Tap a model field to pick one.`,true)}catch{toast('Could not load the model list.')}},
 async testai(b){b.disabled=true;b.textContent='Testing…';try{const t=await chat([{role:'user',content:'Reply with the single word: ready'}],{max:20,temp:0});toast('Connected. The AI said: '+t.slice(0,40),true)}catch(e){toast(e.message)}b.disabled=false;b.textContent='Test connection'},
 export:()=>exportBackup(),
 async clearimgs(b){if(armed!=='clr'){armed='clr';b.textContent='Tap again to delete every image';return}armed=null;await DB.clear('img');URLS.forEach(u=>URL.revokeObjectURL(u));URLS.clear();b.textContent='Images deleted';toast('All images deleted.',true)},
 async delstory(b){if(armed!=='del'){armed='del';b.textContent='Tap again to delete the story and its save';return}armed=null;const id=STORY.id;await DB.set('stories',arr(await DB.get('stories')).filter(s=>s.id!==id));await DB.del('save:'+id);await DB.del('endings:'+id);viewHome()},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;if(ACT[a]){e.preventDefault();ACT[a](b,e)}});
document.addEventListener('submit',e=>{if(e.target.id==='outform'){e.preventDefault();const d=$('#outdesc').value.trim();if(!d)return;const c=chr(selChar);const k=imgKey('out',STORY.id,c.id,uid());G.chars[c.id].outfit=d;save();queueImg(k,portraitPrompt(c,d),768,1024,true);refreshSheet()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('.lightbox'))$('.lightbox').remove();else if(!sheet.hidden)ACT.closesheet()}});

/* ---------- boot ---------- */
(async()=>{try{S={...DEF,...obj(await DB.get('settings'))}}catch(e){toast('Storage is unavailable, so progress will not be saved. Turn off Private Browsing.')}
 viewHome();
 if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script>
